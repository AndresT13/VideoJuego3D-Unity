name: Publish Unity WebGL to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'webgl-site/**'
      - '.github/workflows/deploy-webgl.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: unity-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate WebGL build
        run: |
          test -f webgl-site/index.html || { echo 'Missing webgl-site/index.html: upload your local Unity WebGL build first.' >&2; exit 1; }
          test -d webgl-site/Build || { echo 'Missing webgl-site/Build.' >&2; exit 1; }
          test -d webgl-site/TemplateData || { echo 'Missing webgl-site/TemplateData.' >&2; exit 1; }
          touch webgl-site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webgl-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
